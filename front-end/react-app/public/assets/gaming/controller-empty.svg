<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ctrlGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2d"/>
      <stop offset="100%" stop-color="#13131c"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="200" cy="150" r="110" fill="url(#ctrlGlow)" />
  <!-- Controller Body -->
  <path d="M125 105 C145 102, 175 110, 200 110 C225 110, 255 102, 275 105 C295 108, 318 135, 312 185 C308 215, 278 220, 255 190 C238 170, 222 170, 200 170 C178 170, 162 170, 145 190 C122 220, 92 215, 88 185 C82 135, 105 108, 125 105 Z" fill="url(#bodyGrad)" stroke="#37374a" stroke-width="3" filter="url(#neonBlur)"/>
  <!-- Grip Accents -->
  <path d="M96 150 C94 175, 105 195, 120 195" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M304 150 C306 175, 295 195, 280 195" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- D-Pad -->
  <rect x="135" y="132" width="10" height="26" rx="2" fill="#2d2d42"/>
  <rect x="127" y="140" width="26" height="10" rx="2" fill="#2d2d42"/>
  <circle cx="140" cy="145" r="3" fill="#6366f1"/>
  <!-- Action Buttons -->
  <circle cx="258" cy="135" r="5" fill="#ef4444" opacity="0.9"/>
  <circle cx="270" cy="145" r="5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="246" cy="145" r="5" fill="#22c55e" opacity="0.9"/>
  <circle cx="258" cy="155" r="5" fill="#f59e0b" opacity="0.9"/>
  <!-- Thumbsticks -->
  <circle cx="170" cy="165" r="14" fill="#181822" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="170" cy="165" r="9" fill="#252538"/>
  <circle cx="230" cy="165" r="14" fill="#181822" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="230" cy="165" r="9" fill="#252538"/>
  <!-- Center Logo Indicator -->
  <circle cx="200" cy="135" r="7" fill="#6366f1" opacity="0.9"/>
  <path d="M197 135 L203 135 M200 132 L200 138" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
