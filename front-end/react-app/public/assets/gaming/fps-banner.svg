<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fpsSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c16"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#1f1035"/>
    </linearGradient>
    <linearGradient id="crosshairGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#fpsSky)"/>
  <rect width="1200" height="400" fill="url(#gridPattern)"/>
  <!-- Perspective Cyber Lines -->
  <line x1="0" y1="350" x2="1200" y2="350" stroke="rgba(239, 68, 68, 0.3)" stroke-width="2"/>
  <line x1="600" y1="180" x2="0" y2="400" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1.5"/>
  <line x1="600" y1="180" x2="300" y2="400" stroke="rgba(239, 68, 68, 0.15)" stroke-width="1.5"/>
  <line x1="600" y1="180" x2="900" y2="400" stroke="rgba(239, 68, 68, 0.15)" stroke-width="1.5"/>
  <line x1="600" y1="180" x2="1200" y2="400" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1.5"/>
  <!-- Tactical Reticle Focus -->
  <circle cx="600" cy="180" r="90" fill="none" stroke="url(#crosshairGlow)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="600" cy="180" r="45" fill="none" stroke="rgba(249, 115, 22, 0.6)" stroke-width="2"/>
  <circle cx="600" cy="180" r="4" fill="#ef4444"/>
  <!-- Target Crosslines -->
  <line x1="570" y1="180" x2="520" y2="180" stroke="#ef4444" stroke-width="2"/>
  <line x1="630" y1="180" x2="680" y2="180" stroke="#ef4444" stroke-width="2"/>
  <line x1="600" y1="150" x2="600" y2="100" stroke="#ef4444" stroke-width="2"/>
  <line x1="600" y1="210" x2="600" y2="260" stroke="#ef4444" stroke-width="2"/>
  <!-- Corner Tech HUD Accents -->
  <path d="M 40 40 L 80 40 M 40 40 L 40 80" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" fill="none"/>
  <path d="M 1160 40 L 1120 40 M 1160 40 L 1160 80" stroke="rgba(99, 102, 241, 0.5)" stroke-width="2" fill="none"/>
  <text x="50" y="70" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="12" letter-spacing="2">SYS_FPS_COMBAT_NET // ZONE_01</text>
  <text x="1000" y="70" fill="rgba(239,68,68,0.7)" font-family="monospace" font-size="12" letter-spacing="2">ONLINE // SECURE</text>
</svg>
